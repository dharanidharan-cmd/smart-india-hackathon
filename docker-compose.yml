version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: sih_postgres
    environment:
      POSTGRES_DB: sih_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sih_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: